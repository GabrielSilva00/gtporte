name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  painel:
    name: Painel administrativo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      # O build usa variaveis VITE_*; no CI bastam valores de fachada, porque
      # so precisamos saber se o projeto compila, nao falar com o Supabase.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-ci

  motorista:
    name: App do motorista
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motorista-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: motorista-app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-ci
