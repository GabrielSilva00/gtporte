<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GTPORTE Estudante</title>
    <!-- deploy-trigger: 1789511959 -->
    <script>
      // Aplica o tema antes do primeiro paint para nao piscar branco no escuro.
      (function () {
        try {
          var t = localStorage.getItem('gtporte:tema') || 'sistema'
          var escuro = t === 'escuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F172A')
          }
        } catch (e) {}
      })()
    </script>
    <script>
      // Limpa service workers de outros apps que compartilhem a mesma origem.
      // Sem isso, o SW do painel admin (secretaria) pode servir a pagina errada.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            // Se o SW ativo nao pertence ao app estudante, remove
            if (reg.active && reg.active.scriptURL && !reg.active.scriptURL.includes('/estudante')) {
              reg.unregister().then(function() {
                // Limpa cache antigo tambem
                caches.keys().then(function(names) {
                  names.forEach(function(name) { caches.delete(name) })
                })
                // Recarrega uma vez para garantir que o app certo carregue
                if (!sessionStorage.getItem('sw-cleaned')) {
                  sessionStorage.setItem('sw-cleaned', '1')
                  location.reload()
                }
              })
            }
          })
        })
      }
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
